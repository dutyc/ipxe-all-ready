<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files — IPXE Control Plane</title>
    <style>
        :root {
            --black: #000000;
            --dark-gray: #333333;
            --mid-gray: #666666;
            --light-gray: #999999;
            --border: #e5e5e5;
            --bg-hover: #fafafa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            background-color: #ffffff;
            color: var(--black);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header { margin-bottom: 30px; }

        h1 {
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--black);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--mid-gray);
            margin-bottom: 20px;
        }

        .breadcrumb a {
            color: var(--black);
            text-decoration: none;
            border-bottom: 1px dashed var(--light-gray);
        }

        .breadcrumb a:hover {
            border-bottom-style: solid;
        }

        .search-box { margin-bottom: 20px; }

        #searchInput {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--black);
            background: transparent;
            color: var(--black);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        #searchInput:focus {
            border-bottom: 2px solid var(--black);
        }

        #searchInput::placeholder {
            color: var(--light-gray);
        }

        ul.file-list { list-style: none; }

        li.file-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            transition: background-color 0.1s;
        }

        li.file-item:hover {
            background-color: var(--bg-hover);
        }

        .tag {
            width: 60px;
            flex-shrink: 0;
            color: var(--light-gray);
            font-size: 12px;
            text-align: center;
        }

        .name {
            flex: 1;
            text-decoration: none;
            color: var(--black);
            word-break: break-all;
        }

        .name:hover { text-decoration: underline; }

        .meta {
            width: 140px;
            flex-shrink: 0;
            text-align: right;
            color: var(--mid-gray);
            font-size: 12px;
        }

        .empty {
            padding: 40px 0;
            text-align: center;
            color: var(--light-gray);
        }

        .nav-back {
            margin-bottom: 20px;
            font-size: 12px;
        }

        .nav-back a {
            color: var(--light-gray);
            text-decoration: none;
        }

        .nav-back a:hover {
            color: var(--black);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Directory Index</h1>
            <div class="nav-back">
                <a href="/">← Back to Control Plane</a>
            </div>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Filter files..." autocomplete="off">
            </div>
        </header>

        <ul class="file-list" id="fileList">
            <li class="empty">Loading...</li>
        </ul>
    </div>

    <script>
        /* ── path constants ── */
        var BROWSE_BASE = '/browse';   // URL prefix for file browser
        var API_BASE    = '/api/browse'; // JSON directory listing API
        var DL_BASE     = '/file';       // file serving (iPXE / download)

        /* ── utilities ── */
        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '-';
            var k = 1024;
            var sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            var i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatDate(timeStr) {
            if (!timeStr) return '-';
            var date = new Date(timeStr);
            var y = date.getFullYear();
            var m = String(date.getMonth() + 1).padStart(2, '0');
            var d = String(date.getDate()).padStart(2, '0');
            var h = String(date.getHours()).padStart(2, '0');
            var min = String(date.getMinutes()).padStart(2, '0');
            return y + '-' + m + '-' + d + ' ' + h + ':' + min;
        }

        function safeDecode(str) {
            try { return decodeURIComponent(str); } catch (e) { return str; }
        }

        /* ── derive relative path from URL ── */
        function getRelativePath() {
            var raw = window.location.pathname;
            // strip BROWSE_BASE prefix, keep leading /
            if (raw.indexOf(BROWSE_BASE) === 0) {
                var rel = raw.slice(BROWSE_BASE.length);
                return rel || '/';
            }
            return raw;
        }

        function renderBreadcrumb(relPath) {
            var bc = document.getElementById('breadcrumb');
            var html = '<a href="' + BROWSE_BASE + '/">root</a>';
            if (relPath && relPath !== '/') {
                var parts = relPath.split('/').filter(function(p) { return p; });
                var currentPath = '';
                parts.forEach(function(part) {
                    currentPath += '/' + part;
                    html += ' / <a href="' + BROWSE_BASE + currentPath + '/">' + safeDecode(part) + '</a>';
                });
            }
            bc.innerHTML = html;
        }

        function initSearch() {
            var searchInput = document.getElementById('searchInput');
            var fileItems = document.querySelectorAll('.file-item');
            var emptyMsg = document.querySelector('.empty');

            searchInput.addEventListener('input', function(e) {
                var term = e.target.value.toLowerCase();
                var hasResult = false;

                fileItems.forEach(function(item) {
                    var nameEl = item.querySelector('.name');
                    if (nameEl) {
                        var fileName = nameEl.textContent.toLowerCase();
                        if (fileName.indexOf(term) !== -1) {
                            item.style.display = 'flex';
                            hasResult = true;
                        } else {
                            item.style.display = 'none';
                        }
                    }
                });

                if (emptyMsg) {
                    if (term !== '' && !hasResult) {
                        emptyMsg.style.display = 'block';
                        emptyMsg.textContent = 'No matching files';
                    } else {
                        emptyMsg.style.display = 'none';
                    }
                }
            });
        }

        async function loadFiles() {
            var relPath = getRelativePath();
            renderBreadcrumb(relPath);

            var listEl = document.getElementById('fileList');
            var searchInput = document.getElementById('searchInput');
            searchInput.value = '';

            try {
                var response = await fetch(API_BASE + relPath);
                if (!response.ok) throw new Error('Not Found');
                var data = await response.json();

                if (!data || data.length === 0) {
                    listEl.innerHTML = '<li class="empty">Empty directory</li>';
                    return;
                }

                data.sort(function(a, b) {
                    if (a.name === '..') return -1;
                    if (b.name === '..') return 1;
                    if (a.type === 'directory' && b.type !== 'directory') return -1;
                    if (a.type !== 'directory' && b.type === 'directory') return 1;
                    return a.name.localeCompare(b.name);
                });

                listEl.innerHTML = data.map(function(item) {
                    var isDir = item.type === 'directory';
                    var tag = isDir ? '[DIR]' : '[FILE]';
                    var displayName = safeDecode(item.name);
                    var link;
                    if (item.name === '..') {
                        // parent directory
                        var parts = relPath.replace(/\/$/, '').split('/');
                        parts.pop();
                        var parent = parts.join('/') || '';
                        link = BROWSE_BASE + parent + '/';
                    } else if (isDir) {
                        link = BROWSE_BASE + relPath + item.name + '/';
                    } else {
                        link = DL_BASE + relPath + item.name;
                    }
                    var size = isDir ? '-' : formatSize(item.size);
                    var time = formatDate(item.mtime);

                    return ''
                        + '<li class="file-item">'
                        +   '<span class="tag">' + tag + '</span>'
                        +   '<a href="' + link + '" class="name"' + (isDir ? '' : ' download') + '>' + displayName + '</a>'
                        +   '<span class="meta">' + size + ' | ' + time + '</span>'
                        + '</li>';
                }).join('');

                initSearch();

            } catch (error) {
                listEl.innerHTML = '<li class="empty">Error loading directory</li>';
            }
        }

        loadFiles();
    </script>
</body>
</html>
