worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load njs module
load_module modules/ngx_http_js_module.so;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # njs
    js_path "/etc/nginx/njs/";
    js_import file_list from file-list.js;

    # upstream ── 指向宿主机上的 Control Plane（docker compose 通过 extra_hosts 或 service name 访问）
    upstream control_plane {
        server host.docker.internal:4839;
    }

    server {
        listen 80;
        server_name _;

        # ============================================================
        # Web UI (React SPA) — 根路径
        #   try_files 找不到时回退到 index.html（SPA 路由由 HashRouter 接管）
        #   error_page 404 仅作用于本 location，不影响 /file/ 等下游
        # ============================================================
        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
            error_page 404 /index.html;
        }

        # ============================================================
        # Control Plane API 代理 — /api/cp/* → control_plane:4839
        # ============================================================
        location /api/cp/ {
            proxy_pass http://control_plane/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ============================================================
        # File Browser — /browse/
        #   HTML 页面在 /browse/index.html
        #   JS 读取 window.location.pathname 决定当前浏览目录
        #   例如: /browse/ → 展示 public/ 下的 ISO 和内核文件
        # ============================================================
        location /browse/ {
            alias /usr/share/nginx/browse/;
            try_files $uri /browse/index.html;
        }

        # ============================================================
        # File Browser API — JSON 目录列表
        #   njs 脚本读取 /data/ 下的公开文件目录（ISO, kernel, initrd 等）
        #   请求: GET /api/browse/_tpl/
        #   返回: [{name, type, size, mtime}, ...]
        # ============================================================
        location /api/browse/ {
            js_content file_list.directoryList;
        }

        # ============================================================
        # File Serving — /file/<path>
        #   供 iPXE 脚本下载（chain）、Worker 拉取 ISO 和内核文件
        #   映射到容器内 /data/ = 宿主机 public/ 目录
        #   文件不存在时返回 404
        # ============================================================
        location /file/ {
            alias /data/;
            error_page 404 = @file_404;
        }
        location @file_404 {
            default_type text/plain;
            return 404 'not found';
        }

    }

    # ============================================================
    # HTTPS 引导链入口（iPXE TOFU 信任锚，端口 443）
    #   - 自签证书由控制面启动时自动生成（control_plane/state/certs，TOFU pin 叶证书指纹，CA 层级已消解）
    #   - TLS ≤ 1.2（iPXE mbedTLS 封顶，固件 TLS 版本兼容性约束）
    #   - TOFU 单锚：全部 HTTPS 目标共享本证书——引导链端点、/file/ 资产、/tftp/ 菜单
    # ============================================================
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;

        # ── iPXE 引导链端点（report / challenge / boot-vars）→ control_plane:4839 ──
        # 裸路径原样转发（不带 URI 重写）：/devices/report、/devices/challenge、/boot-vars
        location ~ ^/(devices/|boot-vars) {
            proxy_pass http://control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ── iPXE 资产下载（ISO / kernel / initrd，映射 public/）──
        location /file/ {
            alias /data/;
            error_page 404 = @file_404;
        }
        location @file_404 {
            default_type text/plain;
            return 404 'not found';
        }

        # ── iPXE 菜单与覆盖脚本（映射宿主机 tftp/，与 TFTP 同源）──
        location /tftp/ {
            alias /tftp/;
        }

    }
}
