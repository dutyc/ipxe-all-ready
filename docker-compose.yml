services:

  # ── DHCP / TFTP / 引导文件服务 ──
  # 全链路 host 网络直通：DHCP 应答、iPXE 脚本（tftp/ 挂载）、TFTP 引导文件
  ipxe-dnsmasq:
    image: jpillora/dnsmasq@sha256:98b69ad825942089fb7c4b9153e3c5af0205eda3a103c691e30b1a13fd912830
    container_name: ipxe-dnsmasq
    network_mode: host          
    cap_add:
      - NET_ADMIN              
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
      - ./dnsmasq/dhcp-hosts.conf:/etc/dnsmasq.d/dhcp-hosts.conf
      - ./dnsmasq/dnsmasq.leases:/var/lib/misc/dnsmasq.leases
      - /etc/localtime:/etc/localtime:ro
      - ./tftp:/var/tftp:ro
    restart: unless-stopped
    command: ["--no-daemon", "--log-queries", "--log-dhcp"]    

  # ── 控制面（Control Plane）──
  # Worker 生命周期编排 / Agent 调度 / 台账 / dnsmasq 绑定 / 启动变量投影
  # 配置来源：control_plane/control_plane.env（从 .env.example 复制后修改）
  ipxe-control-plane:
    build:
      context: ./control_plane
      dockerfile: Dockerfile
    image: ipxe-control-plane
    container_name: ipxe-control-plane
    restart: unless-stopped
    ports:
      - "4839:8080"
    env_file:
      - ./control_plane/control_plane.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./control_plane/config:/app/config
      - ./control_plane/state:/app/state
      - /etc/localtime:/etc/localtime:ro
      - ./dnsmasq:/app/dnsmasq

  # ── Web 管理界面 + 文件浏览（nginx）──
  # 静态资源由 webui/app 构建产物挂载；public/ 为 iPXE 公开文件（ISO/kernel/initrd）
  ipxe-nginx:
    build:
      context: ./webui/deploy
      dockerfile: Dockerfile
    container_name: ipxe-cp-webui
    ports:
      - "4838:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # ── Web UI 静态文件 (cd app && npm run build) ──
      - ./webui/app/dist:/usr/share/nginx/html:ro
      # ── 文件浏览器页面 (浏览工具的 HTML/JS 本身) ──
      - ./webui/deploy/www/browse:/usr/share/nginx/browse:ro
      # ── iPXE 公开文件目录: ISO, kernel, initrd (被浏览和下载的数据) ──
      - ./webui/deploy/public:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped