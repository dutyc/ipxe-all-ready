  ipxe-control-plane:
    build:
      context: ./control_plane
      dockerfile: Dockerfile
    image: ipxe-control-plane
    container_name: ipxe-control-plane
    restart: unless-stopped
    ports:
      - "4839:8080"
    env_file:
      - ./control_plane/control_plane.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./control_plane/config:/app/config
      - ./control_plane/state:/app/state
      - ./dnsmasq:/app/dnsmasq

  
  ipxe-nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipxe-cp-webui
    ports:
      - "4838:80"
    volumes:
      # ── Web UI 静态文件 (cd app && npm run build) ──
      - ./webui/app/dist:/usr/share/nginx/html:ro
      # ── 文件浏览器页面 (浏览工具的 HTML/JS 本身) ──
      - ./webui/deploy/www/browse:/usr/share/nginx/browse:ro
      # ── iPXE 公开文件目录: ISO, kernel, initrd (被浏览和下载的数据) ──
      - ./webui/deploy/public:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
      

networks:
  ipxe:
    driver: bridge  # 定义 ipxe 网络