  ipxe-iscsi:
    build:
      context: ./lio
      dockerfile: Dockerfile
    image: ipxe-lio
    container_name: ipxe-iscsi
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - /sys/kernel/config:/sys/kernel/config
      - /etc/localtime:/etc/localtime:ro
      - /lib/modules:/lib/modules:ro
      - /pool1/iscsi_img:/home/iscsi_img
      - ./lio/etc/target:/etc/rtslib-fb-target  
    command:
      - sh
      - -c
      - |
        mkdir -p /run/dbus
        dbus-uuidgen --ensure || true      # 补 machine-id，缺它 dbus-daemon 起不来
        dbus-daemon --system --fork        # 先起总线，targetclid 要往这注册
        targetclid                         # 再起管理守护；前台或后台都不影响下面
        sleep infinity                     # 兜底占住前台，保证容器不退（targetclid 若前台则这行轮不到，无害）      

  ipxe-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: ipxe-agent
    container_name: ipxe-agent
    restart: unless-stopped
    ports:
      - "4840:8080"                    # 控制面 HTTP，给 Controller
    env_file: .env    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # 用来 exec 进 stgt 容器
      - /etc/localtime:/etc/localtime:ro
      - /pool1/iscsi_img:/home/iscsi_img            #请修改为实际存储img硬盘的路径
      - ./agent/logs:/var/log/ipxe-agent
