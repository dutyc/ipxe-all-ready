#!ipxe

# OPTIONAL: Base URL used to resolve most other resources
# Should always end with a slash
set boot-url tftp://${next-server}/

# 同机部署：tftp/dnsmasq/nginx/control-plane 都在同一台服务器上，next-server 即控制面 IP
set controller_ip ${next-server}

# OPTIONAL: What URL to use when sanbooting
# Usually ${boot-url} is used, but required until NFS supports block device API
# Should always end with a slash
set chain-url http://${controller_ip}:4838/file

# OPTIONAL: Relative directory to boot.ipxe used to
# override boot script for specific clients
set boot-dir boot/

# REQUIRED: Absolute URL to the menu script, used by boot.ipxe
# and commonly used at the end of simple override scripts
# in ${boot-dir}.
set menu-url ${boot-url}menu.ipxe

# OPTIONAL: iSCSI server location and iSCSI IQNs
# Must be specified as an IP, some clients have issues with name resolution
# Initiator IQN is also calculated to use hostname, if present
set iscsi-server ${controller_ip}
set base-iqn iqn.2026-07.com.controller
# iSCSI root 连接符默认 stgt 格式；/boot-vars 按后端类型（stgt `:::1:` / LIO `::::`）下发 iscsi-sep 覆盖
set iscsi-sep :::1:
isset ${hostname} && set initiator-iqn ${base-iqn}:${hostname} || set initiator-iqn ${base-iqn}:${mac}

# OPTIONAL: URL to report memtest results to
set memtest-report-url http://boot.smidsrod.lan/memtest-report.cgi

# Fetch per-worker boot variables from Control Plane.
# The endpoint returns an iPXE script with set commands. If it is unreachable,
# the static defaults above remain active.
# 注意：mac 参数用 ${mac}（带冒号）而非 ${mac:hexraw}——部分 iPXE 固件对 hexraw
# 修饰符展开异常（可能为空），后端 _normalize_boot_mac 会剥离冒号，两种格式都能识别
chain --autofree http://${controller_ip}:4839/boot-vars?mac=${mac}&hostname=${hostname} || goto vars-done

# Rebuild derived values after per-worker variables override base-iqn or iscsi-server.
# isset 守卫：/boot-vars 已下发按后端生成的 iscsi-sep（stgt `:::1:` / LIO `::::`）时不覆盖
isset ${iscsi-sep} || set iscsi-sep :::1:
isset ${hostname} && set initiator-iqn ${base-iqn}:${hostname} || set initiator-iqn ${base-iqn}:${mac}

:vars-done
